<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Catalogue — Tree Grows Ltd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="8" fill="#16A34A"/><path d="M20 6 L28 16 H24 L30 24 H10 L16 16 H12 Z" fill="#fff" opacity=".95"/><rect x="18" y="24" width="4" height="6" rx="1" fill="#fff" opacity=".8"/></svg>
        <span class="logo-text">Tree <span class="accent">Grows</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/catalogue.html" style="color:#16A34A">Products</a></li>
        <li><a href="/basket.html" id="basketLink">Quote Basket (<span id="basketCount">0</span>)</a></li>
        <li><a href="/#contact" class="btn btn-nav">Get a Quote</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-hero">
    <div class="container">
      <h1>Product Catalogue</h1>
      <p>Browse our full range — add items to your quote basket and request a free quotation.</p>
    </div>
  </header>

  <!-- Filters & Search -->
  <section class="catalogue-section">
    <div class="container">
      <div class="catalogue-controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search products…"/>
        </div>
        <div class="category-filters" id="categoryFilters">
          <button class="cat-btn active" data-category="">All Products</button>
        </div>
      </div>

      <div class="products-grid" id="productsGrid">
        <div class="loading">Loading products…</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Tree Grows Ltd. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="js/basket.js"></script>
  <script src="js/catalogue.js"></script>
</body>
</html>
